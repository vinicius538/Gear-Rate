<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root{color-scheme:dark;--ink:#f4f1fa;--muted:#a6a0b5;--line:rgba(224,210,255,.11);--panel:#15121d;--accent:#a77af4;--accent-bright:#c2a1ff}
        *{box-sizing:border-box} body{margin:0;background:#09080e;color:var(--ink);font-family:'DM Sans',sans-serif;background-image:radial-gradient(ellipse at 75% -15%,rgba(126,74,204,.2),transparent 43%),radial-gradient(ellipse at 0% 45%,rgba(74,42,119,.12),transparent 35%)}
        h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif} a{color:inherit;text-decoration:none} button,input,select{font:inherit}
        .site-header{position:sticky;top:0;z-index:20;background:rgba(9,8,14,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
        .header-main{max-width:1240px;margin:auto;padding:14px 28px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.04em;white-space:nowrap}.brand img{width:38px;height:38px;object-fit:contain}.brand span{color:var(--accent-bright)}
        .search{display:flex;max-width:470px;flex:1;margin:auto;border:1px solid var(--line);border-radius:12px;background:#15121d;overflow:hidden}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);padding:11px 14px}.search input::placeholder{color:#777786}.search button{border:0;background:transparent;color:#aaa9b7;padding:0 14px;cursor:pointer}.search:focus-within{border-color:rgba(167,122,244,.75);box-shadow:0 0 0 3px rgba(167,122,244,.13)}
        .account-link{display:flex;align-items:center;gap:10px;color:#d9d8e1;font-size:13px;white-space:nowrap}.account-icon{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--accent);font-size:18px}.nav-row{border-top:1px solid rgba(255,255,255,.035)}.nav-links{max-width:1240px;margin:auto;padding:0 28px;display:flex;gap:7px}.nav-links a{padding:12px 15px;color:#aaa9b7;font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:.2s}.nav-links a:hover{color:white;border-color:var(--accent)}
        .page-shell{max-width:1240px;margin:0 auto;padding:56px 28px 88px}.eyebrow{color:var(--accent-bright);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.page-title{font-size:clamp(30px,4vw,46px);line-height:1.07;letter-spacing:-.045em;margin:10px 0 12px}.page-lede{color:var(--muted);font-size:15px;line-height:1.7;max-width:600px}.section-heading{font-size:24px;letter-spacing:-.035em}.product-card{display:block;background:linear-gradient(145deg,rgba(28,23,38,.96),rgba(16,14,22,.96));border:1px solid var(--line);border-radius:18px;padding:14px;transition:transform .22s,border-color .22s,box-shadow .22s}.product-card:hover{transform:translateY(-4px);border-color:rgba(167,122,244,.55);box-shadow:0 16px 45px rgba(0,0,0,.3),0 0 24px rgba(118,70,191,.09)}.product-card img{background:#f5f5f7;border-radius:12px}.rating{color:var(--accent-bright)}
        .field{width:100%;background:#100e16;border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);outline:none}.field:focus{border-color:rgba(167,122,244,.75);box-shadow:0 0 0 3px rgba(167,122,244,.13)}.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,#b48afa,#8855dc);color:white;border:1px solid rgba(224,201,255,.24);border-radius:11px;padding:12px 19px;font-weight:700;box-shadow:0 6px 22px rgba(111,63,180,.22);transition:.2s}.btn-primary:hover{background:linear-gradient(135deg,#c5a5ff,#9665e5);transform:translateY(-1px)}.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#19151f;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:12px 19px;font-weight:600;transition:.2s}.btn-secondary:hover{border-color:rgba(191,158,242,.4);background:#211a2b}
        .auth-layout{min-height:calc(100vh - 116px);display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,440px);gap:50px;align-items:center;max-width:1050px;margin:auto;padding:52px 28px}.auth-aside{padding:38px;border:1px solid var(--line);border-radius:26px;background:radial-gradient(ellipse at 20% 15%,rgba(141,89,215,.26),transparent 55%),linear-gradient(145deg,#191522,#100e15)}.auth-card{padding:34px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(150deg,#17131f,#100e15);box-shadow:0 24px 70px rgba(0,0,0,.3)}.auth-card input:not([type=checkbox]){width:100%;background:#0d0b12;border:1px solid var(--line);border-radius:11px;padding:13px 14px;color:var(--ink);outline:none}.auth-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,122,244,.13)}.auth-card input::placeholder{color:#817b8e}.account-panel{width:min(100% - 36px,850px);margin:55px auto;padding:32px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#17131f,#100e15)}
        .site-footer{border-top:1px solid var(--line);background:rgba(10,8,14,.65)}.footer-inner{max-width:1240px;margin:auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#898397;font-size:12px}.footer-links{display:flex;gap:18px}.footer-links a:hover{color:var(--accent-bright)}
        @media(max-width:700px){.header-main{padding:12px 16px;gap:12px;flex-wrap:wrap}.brand img{width:32px;height:32px}.brand{font-size:17px}.search{order:3;flex-basis:100%;max-width:none}.account-link span{display:none}.nav-links{padding:0 10px;justify-content:center}.nav-links a{padding:11px 12px;font-size:12px}.page-shell{padding:38px 18px 64px}.auth-layout{grid-template-columns:1fr;padding:32px 18px}.auth-card{padding:25px}.account-panel{margin:30px auto;padding:22px}.footer-inner{padding:20px 18px;flex-wrap:wrap;justify-content:center;text-align:center}.footer-inner>.brand{display:none}}
    </style>
    <title>{% block title %}Gear Rate{% endblock %}</title>
</head>
<body>
    {% include 'partials/navbar.html' %}
    {% block content %}{% endblock %}
    <footer class="site-footer"><div class="footer-inner"><a class="brand" href="/" style="font-size:14px"><img src="{{ url_for('static', filename='img/gr_nav.png') }}" alt="" style="width:26px;height:26px"><span>GEAR</span>RATE</a><div class="footer-links"><a href="/perifericos">Catálogo</a><a href="/comparacao">Comparar</a><a href="/ranking">Ranking</a></div><span>Gear Rate · Escolha melhor.</span></div></footer>
</body>
</html>
