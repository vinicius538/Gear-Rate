<header class="site-header">
    <div class="header-main">
        <a class="brand" href="/" aria-label="Gear Rate, página inicial">
            <img src="{{ url_for('static', filename='img/gr_nav.png') }}" alt="">
            <span>GEAR</span>RATE
        </a>
        <form class="search" role="search" action="/perifericos" method="GET">
            <button type="submit" aria-label="Pesquisar"><i class="bi bi-search"></i></button>
            <input type="search" name="q" placeholder="Busque por produto ou categoria" aria-label="Buscar periféricos">
        </form>
        <a class="account-link" href="{{ '/config' if session.get('nome') else '/login' }}">
            <span>{{ 'Olá, ' ~ session['nome'] if session.get('nome') else 'Entrar na conta' }}</span>
            <span class="account-icon"><i class="bi bi-person"></i></span>
        </a>
    </div>
    <div class="nav-row">
        <nav class="nav-links" aria-label="Navegação principal">
            <a href="/perifericos"><i class="bi bi-grid-3x3-gap mr-2"></i>Periféricos</a>
            <a href="/comparacao"><i class="bi bi-arrow-left-right mr-2"></i>Comparar</a>
            <a href="/ranking"><i class="bi bi-trophy mr-2"></i>Ranking</a>
        </nav>
    </div>
</header>
